<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700" viewBox="0 0 500 700">
  <defs>
    <!-- 진한 사파이어 바탕: 옅은 하늘색이던 예전 판은 OC 와 무늬가 바탕에 묻혀 작게 보면 흐릿했다. 어둡게 깔고 얼음빛은 선과 면에만 쓴다. -->
    <radialGradient id="felt" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#1d8fd0"/>
      <stop offset=".45" stop-color="#0b4d86"/>
      <stop offset="1" stop-color="#030f26"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#8fd6ff"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#3f9fe0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#a6e3ff"/>
      <stop offset="1" stop-color="#4aa8e8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fe6ff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#3aa5e6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3aa5e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1676b8"/>
      <stop offset="1" stop-color="#03163a"/>
    </radialGradient>
    <!-- 컷 보석 무늬: 마름모마다 윗면은 밝게, 아랫면은 어둡게 -->
    <pattern id="facets" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45 250 350)">
      <path d="M0 0H40V40z" fill="#ffffff" opacity=".09"/>
      <path d="M0 0V40H40z" fill="#000a1c" opacity=".2"/>
      <path d="M0 0H40M0 0V40" stroke="#bfeaff" stroke-width="1.3" opacity=".6"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff" opacity=".85"/>
    </pattern>
    <path id="spark" d="M0-1 .18-.18 1 0 .18.18 0 1-.18.18-1 0-.18-.18z"/>
    <clipPath id="inner"><rect x="26" y="26" width="448" height="648" rx="18"/></clipPath>
  </defs>
  <rect x="2" y="2" width="496" height="696" rx="34" fill="#fbf8f1" stroke="#d9d2c2" stroke-width="2"/>
  <g clip-path="url(#inner)">
    <rect x="26" y="26" width="448" height="648" fill="url(#felt)"/>
    <rect x="26" y="26" width="448" height="648" fill="url(#facets)"/>
    <!-- 가운데 보석 모양(◆) 테: 메달 둘레로 광채가 번지게 -->
    <circle cx="250" cy="350" r="210" fill="url(#halo)"/>
    <path d="M250 112L412 350 250 588 88 350z" fill="none" stroke="url(#ice)" stroke-width="3.4" opacity=".95"/>
    <path d="M250 150L378 350 250 550 122 350z" fill="none" stroke="#bfeaff" stroke-width="1.4" opacity=".7"/>
    <path d="M250 112V240M250 460V588M88 350H146M354 350H412M250 112L146 350 250 588 354 350z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".35"/>
  </g>
  <rect x="26" y="26" width="448" height="648" rx="18" fill="none" stroke="url(#ice)" stroke-width="5"/>
  <rect x="40" y="40" width="420" height="620" rx="12" fill="none" stroke="#bfeaff" stroke-width="1.6" opacity=".85"/>
  <g fill="url(#gem)" stroke="#ffffff" stroke-width="1">
    <path d="M250 50l11 16-11 16-11-16z"/>
    <path d="M250 618l11 16-11 16-11-16z"/>
    <path d="M50 350l16-11 16 11-16 11z"/>
    <path d="M418 350l16-11 16 11-16 11z"/>
    <path d="M60 60l22 5-17 17z"/>
    <path d="M440 60l-22 5 17 17z"/>
    <path d="M60 640l22-5-17-17z"/>
    <path d="M440 640l-22-5 17-17z"/>
  </g>
  <g fill="#ffffff">
    <use href="#spark" transform="translate(128 168) scale(15)" opacity=".95"/>
    <use href="#spark" transform="translate(376 214) scale(10)" opacity=".9"/>
    <use href="#spark" transform="translate(120 500) scale(9)" opacity=".85"/>
    <use href="#spark" transform="translate(372 548) scale(16)" opacity=".95"/>
    <use href="#spark" transform="translate(96 300) scale(7)" opacity=".8"/>
    <use href="#spark" transform="translate(406 420) scale(8)" opacity=".8"/>
  </g>
  <g transform="translate(250 350)">
    <circle r="112" fill="#7fd0ff" opacity=".28"/>
    <circle r="104" fill="url(#disc)" stroke="url(#ice)" stroke-width="7"/>
    <circle r="92" fill="none" stroke="#bfeaff" stroke-width="1.4" stroke-dasharray="2 5"/>
    <circle r="84" fill="none" stroke="url(#ice)" stroke-width="2.4"/>
    <g fill="url(#gem)" stroke="#ffffff" stroke-width=".8">
      <path d="M0-104l8 12h-16z"/><path d="M0 104l8-12h-16z"/><path d="M-104 0l12 8v-16z"/><path d="M104 0l-12 8v-16z"/>
    </g>
    <text y="27" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-2" fill="#7fd6ff" opacity=".55" stroke="#7fd6ff" stroke-width="7" stroke-linejoin="round">OC</text>
    <text y="27" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-2" fill="url(#ice)" stroke="#021226" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">OC</text>
    <path d="M-46 44H46" stroke="url(#ice)" stroke-width="1.8"/>
    <path d="M-46 -48H46" stroke="url(#ice)" stroke-width="1.8"/>
  </g>
</svg>
