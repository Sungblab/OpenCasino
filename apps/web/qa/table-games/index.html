<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표 게임 보드 실험실</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #eee; font-family: system-ui, sans-serif; }
      #root { position: fixed; inset: 0; display: grid; }
      #bar { position: fixed; left: 8px; bottom: 8px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; }
      #bar button { background: #222a; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="bar"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
