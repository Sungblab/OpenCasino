# 로컬 개발용. 기본은 PostgreSQL 만 띄운다(npm run db:up). API 는 보통 `npm run dev` 로 호스트에서 돈다.
#
#   docker compose up -d postgres                 DB 만
#
# POSTGRES_* 를 바꾸려면 루트 .env 에 적는다(compose 가 자동으로 읽는다). 기본값은 .env.example 과 같다.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencasino}
      POSTGRES_USER: ${POSTGRES_USER:-opencasino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencasino}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opencasino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  opencasino-postgres-data:
